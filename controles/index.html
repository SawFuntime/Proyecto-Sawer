    <script>
        const CORREO_ADMIN = "willem0711@gmail.com";
        const firebaseConfig = {
            apiKey: "AIzaSyDr_IscODIrscMWwoyEogJ56kNUo2VK3Ac",
            authDomain: "proyecto-sawer.firebaseapp.com",
            databaseURL: "https://proyecto-sawer-default-rtdb.firebaseio.com",
            projectId: "proyecto-sawer",
            storageBucket: "proyecto-sawer.firebasestorage.app",
            messagingSenderId: "770496172923",
            appId: "1:770496172923:web:79782a0ddbdca6561e23de"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        // 🚨 EL GUARDIA DE SEGURIDAD 🚨
        auth.onAuthStateChanged(user => {
            if (user && user.email === CORREO_ADMIN) {
                document.getElementById('pantalla-carga').classList.add('hidden');
                const app = document.getElementById('app-container');
                app.classList.remove('hidden');
                app.classList.add('flex');
            } else {
                window.location.href = '../fun.html';
            }
        });

        function logout() {
            auth.signOut().then(() => {
                window.location.href = '../fun.html';
            });
        }

        /* SONIDOS */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playHoverSound() { if (audioCtx.state === 'suspended') return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sine'; osc.frequency.setValueAtTime(900, audioCtx.currentTime); gain.gain.setValueAtTime(0.015, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05); }
        function playClickSound() { if (audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(450, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }
        document.body.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); }, { once: true });
        
        function reasignarSonidos() {
            document.querySelectorAll('.sound-btn, .sound-card').forEach(el => {
                el.addEventListener('mouseenter', playHoverSound);
                el.addEventListener('mousedown', playClickSound);
            });
        }
        
        // Asignar los sonidos a los botones estáticos generados
        setTimeout(() => { reasignarSonidos(); }, 500);
    </script>
