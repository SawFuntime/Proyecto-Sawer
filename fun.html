<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawer Admin Panel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sawerRed: 'rgb(155, 0, 0)',
                        sawerGrey: 'rgb(25, 25, 25)',
                        sawerDark: 'rgb(15, 15, 15)'
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-sawerDark text-white font-sans min-h-screen flex flex-col items-center justify-center">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="bg-sawerGrey p-8 rounded-lg shadow-[0_0_15px_rgba(155,0,0,0.5)] w-96 text-center">
        <!-- Puedes cambiar el src por la URL real del logo de Proyecto Sawer -->
        <img src="https://via.placeholder.com/100/9b0000/ffffff?text=Sawer" alt="Proyecto Sawer" class="w-24 h-24 mx-auto mb-4 rounded-full border-2 border-sawerRed">
        <h2 class="text-2xl font-bold mb-6 tracking-wider">ACCESO LÍDER</h2>
        
        <input type="email" id="email" placeholder="Correo de acceso" class="w-full mb-4 p-3 bg-sawerDark border border-sawerRed rounded text-white focus:outline-none focus:ring-2 focus:ring-sawerRed">
        <input type="password" id="password" placeholder="Contraseña" class="w-full mb-6 p-3 bg-sawerDark border border-sawerRed rounded text-white focus:outline-none focus:ring-2 focus:ring-sawerRed">
        
        <button onclick="login()" class="w-full bg-sawerRed hover:bg-red-800 text-white font-bold py-3 rounded transition-colors">
            ENTRAR AL SISTEMA
        </button>
        <p id="error-msg" class="text-red-500 mt-4 hidden text-sm"></p>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN (Oculto por defecto) -->
    <div id="admin-panel" class="hidden w-full max-w-6xl p-8">
        <div class="flex justify-between items-center mb-8 bg-sawerGrey p-4 rounded border-l-4 border-sawerRed">
            <h1 class="text-3xl font-bold">Panel de Control: Proyecto Sawer</h1>
            <button onclick="logout()" class="bg-sawerDark border border-sawerRed hover:bg-sawerRed text-white px-4 py-2 rounded transition-colors">
                Cerrar Sesión
            </button>
        </div>
        
        <div class="bg-sawerGrey p-6 rounded shadow-lg">
            <h3 class="text-xl font-bold mb-4 border-b border-sawerRed pb-2">Bienvenido, Líder. El sistema está en línea.</h3>
            <p class="text-gray-400">Pronto conectaremos la terminal de búsqueda de jugadores aquí...</p>
        </div>
    </div>

    <script>
        // ⚠️ IMPORTANTE: Reemplaza esto con los datos de tu Firebase
        // (Los encuentras en Firebase -> Ícono de Tuerca -> Configuración del proyecto -> Mis apps)
const firebaseConfig = {
  apiKey: "AIzaSyDr_IscODIrscMWwoyEogJ56kNUo2VK3Ac",
  authDomain: "proyecto-sawer.firebaseapp.com",
  databaseURL: "https://proyecto-sawer-default-rtdb.firebaseio.com",
  projectId: "proyecto-sawer",
  storageBucket: "proyecto-sawer.firebasestorage.app",
  messagingSenderId: "770496172923",
  appId: "1:770496172923:web:79782a0ddbdca6561e23de",
  measurementId: "G-XX2DH8WCJM"
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        const loginScreen = document.getElementById('login-screen');
        const adminPanel = document.getElementById('admin-panel');
        const errorMsg = document.getElementById('error-msg');

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    loginScreen.classList.add('hidden');
                    adminPanel.classList.remove('hidden');
                    errorMsg.classList.add('hidden');
                })
                .catch((error) => {
                    errorMsg.textContent = "Acceso denegado: " + error.message;
                    errorMsg.classList.remove('hidden');
                });
        }

        function logout() {
            auth.signOut().then(() => {
                loginScreen.classList.remove('hidden');
                adminPanel.classList.add('hidden');
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
            });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                loginScreen.classList.add('hidden');
                adminPanel.classList.remove('hidden');
            } else {
                loginScreen.classList.remove('hidden');
                adminPanel.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
